title = "Does FundedNext Futures allow overnight and weekend trade holding?"
url = "https://helpfutures.fundednext.com/en/articles/14268506-does-fundednext-futures-allow-overnight-and-weekend-trade-holding"
excerpts = [
  "FundedNext Futures does not allow overnight or weekend trade holding. Traders must close all positions by 3:10 PM Central Time (CT) each trading day. Positions not closed by this time are automatically closed. Trading can resume at 5:00 PM CT, and after the weekend, trading resumes on Sunday at 5:00 PM CT.",
]

