# Official FundedNext sources used for the Futures Flex $50K profiles (retrieved 2026-11-22).
#
# Retrieval method: FundedNext's own knowledge base (the official help-center FAQ, queried through
# FundedNext's knowledge-base search). Each result returned the article title, a text excerpt and the
# article URL below. The help-center web pages themselves could NOT be opened from the build
# environment (network policy), so only excerpts were read: a human must read the full pages before
# any profile is marked VERIFIED and activated. No effective dates were shown in the excerpts.
#
# This file is reference material for humans; the profiles carry their own [[sources]] copies.

