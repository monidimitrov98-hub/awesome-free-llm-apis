[[rules]]
id = "FNF-FLEX50-MLL"
type = "max_loss"
description = "Maximum Loss Limit $1,500, trailing end-of-day on the balance, never moves down, locks at $50,100; floating (open) losses can breach it intraday (permanent breach)."
mandatory = true
safety_critical = true
severity = "block"
verification = "VERIFIED"
sources = ["S2", "S3", "S4"]
ambiguity = "The funded account uses the same trailing EOD MLL as the Challenge (S2). The live-account stage (S14) also mentions the MLL locking when a payout is requested; that would leave the floor lower than modelled here (this model is the more conservative one). The excerpts state $1,500, trailing EOD on the balance, lock at $50,100 and intraday breach by floating losses; see FNF-FLEX50-MLL-EOD for the unresolved update time / boundary."
params = { amount = 1500.0, model = "trailing_eod", reference = "balance", lock_at = 50100.0, includes_unrealized = true, breach_when = "at_or_below" }

[[rules]]
id = "FNF-FLEX50-MLL-EOD"
type = "other"
description = "Exact end-of-day time at which the MLL trails, and whether equity EXACTLY at the MLL is a breach."
mandatory = true
safety_critical = true
severity = "block"
verification = "UNVERIFIED"
sources = ["S1", "S4"]
ambiguity = "The excerpts are cut off ('updates once per day at the end of…'). The engine trails at its trading-day start (5:00 PM CT, after the mandatory 3:10 PM CT flat time, so the balance is final) and treats equity AT the MLL as a breach (conservative). Confirm on the full pages."

[[rules]]
id = "FNF-FLEX50-NO-DLL"
type = "daily_loss"
description = "No daily loss limit on the Flex FundedNext Account (stated by FundedNext). Not enforced; internal RiskManager limits still apply."
applicable = false
verification = "VERIFIED"
sources = ["S2"]

[[rules]]
id = "FNF-FLEX50-CONTRACTS"
type = "max_contracts"
description = "At most 3 e-mini or 30 micro e-mini contracts held at once, mixed at 1:10 (micro-equivalent 30). Same for Challenge and FundedNext Account."
mandatory = true
safety_critical = true
severity = "block"
verification = "VERIFIED"
sources = ["S1", "S5"]
ambiguity = "The firm deducts profit from excess contracts rather than breaching; this engine BLOCKS any entry that would exceed the limit (stricter). The live-account stage (S14) lists different limits and is not applied."
params = { limit_micro_equivalent = 30, weights = { MES = 1, MNQ = 1, M2K = 1, ES = 10, NQ = 10, RTY = 10 } }

[[rules]]
id = "FNF-FLEX50-INSTRUMENTS"
type = "instrument_allowlist"
description = "CME equity index futures listed by FundedNext Futures (only MES and MNQ are configured in this system)."
mandatory = true
safety_critical = false
verification = "VERIFIED"
sources = ["S9"]
ambiguity = "Excerpt lists CME equity futures only; other asset classes are outside this system's scope."
params = { roots = ["MES", "MNQ", "ES", "NQ", "M2K", "RTY"] }

[[rules]]
id = "FNF-FLEX50-FLAT-BY"
type = "flat_by"
description = "No overnight or weekend holding: all positions closed by 3:10 PM CT each trading day (the firm auto-closes)."
mandatory = true
safety_critical = true
verification = "VERIFIED"
sources = ["S6"]
params = { time = "15:10" }

[[rules]]
id = "FNF-FLEX50-HOURS"
type = "trading_hours"
description = "Trading resumes at 5:00 PM CT (Sunday 5:00 PM CT after the weekend)."
mandatory = true
safety_critical = true
verification = "VERIFIED"
sources = ["S6"]
params = { day_start = "17:00" }

[[rules]]
id = "FNF-FLEX50-HOLIDAYS"
type = "holiday_schedule"
description = "Holiday hours and early closes are communicated by the firm in advance; automatic closure may not apply at an early close."
mandatory = true
safety_critical = true
verification = "NOT_FOUND"
sources = ["S10"]
ambiguity = "No published schedule was retrieved. Without config/prop_firms/holidays/fundednext_futures.toml covering the trading date, new entries fail closed."
params = { calendar = "fundednext_futures" }

[[rules]]
id = "FNF-FLEX50-NEWS"
type = "news_restriction"
description = "FundedNext Futures imposes no news trading rule (Challenge and FundedNext Account). The system's own NewsGuard remains active independently."
applicable = false
verification = "VERIFIED"
sources = ["S7"]

[[rules]]
id = "FNF-FLEX50-PROHIBITED"
type = "other"
description = "Prohibited practices (e.g. platform error exploitation, account sharing, multi-order spam, spoofing, layering, grid trading, wash trading, latency exploitation). Not machine-checkable here; this system places no real orders."
mandatory = false
severity = "info"
verification = "VERIFIED"
sources = ["S15"]
[[rules]]
id = "FNF-FLEX50-NO-CONSISTENCY"
type = "consistency"
description = "No consistency rule on the Flex FundedNext Account."
applicable = false
verification = "VERIFIED"
sources = ["S2", "S8"]

[[rules]]
id = "FNF-FLEX50-BENCHMARK-DAYS"
type = "payout_benchmark_days"
description = "At least 5 Benchmark Days of $200 before each Performance Reward withdrawal."
mandatory = true
severity = "info"
verification = "UNVERIFIED"
sources = ["S2", "S11", "S12"]
stages = ["funded"]
ambiguity = "The excerpt defining a Benchmark Day is cut off ('achieve at least the minimum…'): whether the $200 is net of commissions, realized only, and how the counter resets after a withdrawal is not confirmed. The tracker uses the net realized balance change per trading day."
params = { days = 5, min_day_profit = 200.0 }

