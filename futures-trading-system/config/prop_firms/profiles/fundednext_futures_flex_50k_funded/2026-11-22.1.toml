# FundedNext Futures — Flex — $50,000 — FUNDED (FundedNext Account) stage.
# RESEARCH / SIMULATION PROFILE. NOT approved for any live or funded account.
# Status is UNVERIFIED: safety-relevant details could not be confirmed from the retrieved official
# excerpts (see the rules marked UNVERIFIED / NOT_FOUND). The engine therefore refuses to treat it as
# operational: every new entry is blocked while it is selected, until a human reads the full official
# pages, resolves the open points, records the review and activates the exact file content.

[profile]
id = "fundednext_futures_flex_50k_funded"
version = "2026-11-22.1"
firm = "FundedNext Futures"
product = "Futures Flex"
stage = "funded"
account_size = 50000
account_type = "Flex FundedNext Account (simulated funded)"
initial_balance = 50000.0
currency = "USD"
timezone = "America/Chicago"
day_start = "17:00"                 # trading resumes 5:00 PM CT (S6); times after it belong to the next trading day
status = "UNVERIFIED"
description = "FundedNext Futures Flex $50K FundedNext Account rules from FundedNext's official knowledge base (excerpts)."

[verification]
retrieved = "2026-11-22"
method = "FundedNext official knowledge base search (help-center FAQ excerpts with article URLs); full help-center pages not reachable from the build environment"
reviewed_by = ""
reviewed_on = ""
notes = "Human review required: read the full pages S1-S15, confirm the UNVERIFIED items, then set status, reviewed_by and reviewed_on in a NEW version file."

# Our own margins (NOT firm rules).
[internal]
safety_reserve = 300.0              # no new entry when the estimated official buffer is at or below $300
flatten_reserve = 150.0             # flatten open positions at or below $150 of estimated buffer
uncertainty_reserve = 50.0          # fees / fills / data may differ from the firm's own figures
entry_cutoff_minutes = 15           # no new entries after 2:55 PM CT
flatten_lead_minutes = 5            # flatten from 3:05 PM CT (the firm auto-closes at 3:10 PM CT)
gap_reserve_ticks = 8               # per contract, added to each trade's risk at the fill
quantity_policy = "reject"
require_trade_risk_within_buffer = true

